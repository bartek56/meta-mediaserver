# Optional build configuration for the Qt5 image and the product's
# 800x480 HDMI/ADS7846 display profile.
#
# Load this file with BitBake's -R option when building
# mediaserver-image-qt5. It is intentionally not in layer.conf: HDMI and
# firmware settings must not affect every image in the build directory.

DISTRO_FEATURES:append = " qt5"

# Validation-only flag. No recipe or BSP component consumes this variable.
MEDIASERVER_QT5_HDMI_PROFILE = "1"

HDMI_GROUP = "2"
HDMI_MODE = "87"
HDMI_FORCE_HOTPLUG = "1"
HDMI_DRIVE = "1"
HDMI_CVT = "800 480 60 6 0 0 0"
GPU_MEM_1024 = "256"
ENABLE_UART = "1"
ENABLE_SPI_BUS = "1"
DISABLE_OVERSCAN = "1"
DISABLE_RPI_BOOT_LOGO = "1"

# Touchscreen support is independent of HDMI, but this product profile uses
# both on the same panel. The overlay must exist in the selected firmware.
RPI_EXTRA_CONFIG:append = " \
dtparam=audio=on \n\
dtoverlay=ads7846,cs=1,penirq=25,penirq_pull=2,speed=50000,keep_vref_on=0,swapxy=0 \n\
dtparam=pmax=255,xohms=60,xmin=120,xmax=4000,ymin=440,ymax=3900 \n\
"
